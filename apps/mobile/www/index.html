<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <title>LobeHub</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #f8f8f8;
        color: #111;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #000;
          color: #fff;
        }
      }
      .spinner {
        width: 28px;
        height: 28px;
        border: 3px solid currentColor;
        border-right-color: transparent;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        opacity: 0.5;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <!--
      Placeholder shown only briefly while the native WebView connects to the
      hosted LobeHub app (see capacitor.config.ts). In bundled/offline mode this
      directory is replaced by the built mobile SPA via `npm run copy:web`.
    -->
    <div class="spinner" role="status" aria-label="Loading"></div>
  </body>
</html>
